name: test
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/*.test.mjs
      - name: task-file tooling
        run: node --test scripts/todo/__tests__/*.test.mjs
      - name: generated TODO is current
        run: node scripts/todo/build.mjs --check
      - name: extension metadata is valid JSON
        run: python3 -m json.tool extension/metadata.json > /dev/null
      - name: extension settings schema
        run: glib-compile-schemas --strict --dry-run extension/schemas
