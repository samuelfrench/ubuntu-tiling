[project]
name = "ubuntu-tiling"
version = "0.1.0"
description = "Define screen zones on Ubuntu and snap windows to them."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Samuel French"}]

[project.scripts]
ubuntu-tiling = "ubuntu_tiling.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
